name: Build Kernel with ReSukiSU Ultima

on:
  workflow_dispatch:
  push:
    branches:
      - android-4.4-stable

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3

      - name: 2. Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: android-4.4-stable
          fetch-depth: 1

      - name: 3. Integrasi ReSukiSU Ultima (Direct Setup)
        run: |
          # Menggunakan script resmi Ultima langsung
          curl -LSs "https://raw.githubusercontent.com/spacealtctrl/ReSukiSU-Ultima/main/kernel/setup.sh" | bash -s manual

      - name: 4. Deteksi Defconfig & Compile
        run: |
          set -x # Mencetak setiap perintah yang dieksekusi untuk debugging
          
          echo "=== DAFTAR DEFCONFIG YANG TERSEDIA ==="
          find arch/arm64/configs -name "*defconfig" | sort
          
          echo "=== MENCARI DEFCONFIG LAVENDER ==="
          if [ -f "arch/arm64/configs/vendor/lavender-perf_defconfig" ]; then
            DEFCONFIG_NAME="vendor/lavender-perf_defconfig"
          elif [ -f "arch/arm64/configs/vendor/lavender_defconfig" ]; then
            DEFCONFIG_NAME="vendor/lavender_defconfig"
          elif [ -f "arch/arm64/configs/lavender_defconfig" ]; then
            DEFCONFIG_NAME="lavender_defconfig"
          elif [ -f "arch/arm64/configs/vendor/sdm660-perf_defconfig" ]; then
            DEFCONFIG_NAME="vendor/sdm660-perf_defconfig"
          elif [ -f "arch/arm64/configs/vendor/sdm660_defconfig" ]; then
            DEFCONFIG_NAME="vendor/sdm660_defconfig"
          elif [ -f "arch/arm64/configs/sdm660_defconfig" ]; then
            DEFCONFIG_NAME="sdm660_defconfig"
          else
            echo "❌ Defconfig lavender/sdm660 tidak ditemukan, mencoba vendor_defconfig."
            DEFCONFIG_NAME="vendor_defconfig"
          fi
          echo "✅ Menggunakan Defconfig: $DEFCONFIG_NAME"

          # Tambahkan konfigurasi KSU secara eksplisit
          cat << 'EOF' >> "arch/arm64/configs/$DEFCONFIG_NAME"
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
          EOF

          echo "=== SETUP TOOLCHAIN GCC ==="
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 gcc32
          
          export CROSS_COMPILE="$PWD/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$PWD/gcc32/bin/arm-linux-androideabi-"
          export PATH="$PWD/gcc64/bin:$PWD/gcc32/bin:$PATH"
          
          echo "=== MENGKONFIGURASI KERNEL ==="
          make O=out ARCH=arm64 "$DEFCONFIG_NAME"
          
          echo "=== MEMULAI KOMPILASI ==="
          make -j$(nproc --all) O=out ARCH=arm64 CC="${CROSS_COMPILE}gcc" CROSS_COMPILE="$CROSS_COMPILE" CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"

      - name: 5. Bungkus ke AnyKernel3 (.zip)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          sed -i 's/device.name1=.*/device.name1=lavender/' AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=0/do.devicecheck=1/' AnyKernel3/anykernel.sh
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Kernel-Lavender-ReSukiSU-Ultima.zip * -x .git README.md *placeholder

      - name: 6. Upload Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Lavender-ReSukiSU-Ultima
          path: Kernel-Lavender-ReSukiSU-Ultima.zip
