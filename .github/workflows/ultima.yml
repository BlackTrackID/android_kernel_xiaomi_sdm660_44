name: Build Kernel with ReSukiSU Ultima

on:
  workflow_dispatch:
  push:
    branches:
      - android-4.4-stable

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: android-4.4-stable

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: .
          kernel-branch: android-4.4-stable
          config: vendor_defconfig # Jika gagal, coba ganti jadi lavender_defconfig
          arch: arm64
          aosp-gcc: true
          android-version: 10
          ksu: true
          ksu-other: true
          ksu-url: https://github.com/spacealtctrl/ReSukiSU-Ultima
